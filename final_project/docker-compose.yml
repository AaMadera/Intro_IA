services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    command:
      - uv
      - run
      - --locked
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment:
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-${GEMINI_API_KEY:?GOOGLE_API_KEY o GEMINI_API_KEY debe estar configurada en final_project/.env}}
      GOOGLE_EMBEDDING_MODEL: ${GOOGLE_EMBEDDING_MODEL:-gemini-embedding-001}
      GOOGLE_GENERATION_MODEL: ${GOOGLE_GENERATION_MODEL:-gemini-flash-latest}
      CHROMA_PATH: /app/chroma
    ports:
      - "8000:8000"
    volumes:
      - ./chroma:/app/chroma
      - ./data/processed:/app/data/processed
      - ./data/source:/app/data/source
      - ./pdfs_seed:/app/pdfs_seed:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 10s
      timeout: 5s
      retries: 5

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    command:
      - uv
      - run
      - --locked
      - streamlit
      - run
      - ui/streamlit_app.py
      - --server.address
      - 0.0.0.0
      - --server.port
      - "8501"
    environment:
      API_BASE_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8501:8501"
